<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Дилшод · Карта антенн Душанбе</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --ink: #070a11;
    --glass: rgba(12, 17, 28, .88);
    --glass-2: rgba(20, 27, 42, .92);
    --raise: #161e30;
    --line: rgba(146, 163, 200, .16);
    --line-2: rgba(146, 163, 200, .30);
    --text: #ecf0f9;
    --muted: #8d99b5;
    --faint: #5b667f;
    --accent: #ff6b35;
    --accent-2: #ffb454;
    --accent-soft: rgba(255, 107, 53, .14);
    --tower: #ff3d5a;
    --ok: #2dd4a7;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --disp: "Unbounded", "Golos Text", sans-serif;
    --body: "Golos Text", -apple-system, "Segoe UI", Roboto, sans-serif;
    --peek: calc(64px + env(safe-area-inset-bottom, 0px));
    --ease: cubic-bezier(.32, .72, .24, 1);
    --shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 2px 10px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--body); color: var(--text); background: var(--ink);
    height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  #map { position: absolute; inset: 0; background: var(--ink); }
  #map canvas { outline: none; }

  /* ═══════════════ floating control panel ═══════════════ */
  #panel {
    position: absolute; z-index: 30; top: 14px; left: 14px; bottom: 14px; width: 372px;
    display: flex; flex-direction: column;
    background: var(--glass); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
    overflow: hidden; transition: transform .38s var(--ease), opacity .38s var(--ease);
  }
  body.panel-hidden #panel { transform: translateX(-112%); opacity: 0; pointer-events: none; }

  #panelOpen {
    position: absolute; z-index: 29; top: 14px; left: 14px; display: none; align-items: center; gap: 9px;
    padding: 11px 16px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    font: 600 13px/1 var(--body); letter-spacing: .02em; cursor: pointer; box-shadow: var(--shadow);
    transition: border-color .15s;
  }
  #panelOpen:hover { border-color: var(--accent); }
  body.panel-hidden #panelOpen { display: flex; }

  .sheet-toggle { display: none; }

  .head { padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(145deg, #ff7a45, #e5330f); color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  }
  .logo svg { width: 21px; height: 21px; }
  .brand h1 {
    margin: 0; font: 700 15px/1.15 var(--disp); letter-spacing: .14em; text-transform: uppercase;
  }
  .brand h1 em { font-style: normal; color: var(--accent-2); }
  .brand .sub { margin-top: 3px; font-size: 11.5px; color: var(--muted); letter-spacing: .01em; }
  .navbtn {
    margin-left: auto; flex: 0 0 auto; width: 28px; height: 28px; display: grid; place-items: center;
    background: transparent; border: 1px solid var(--line); border-radius: 9px; color: var(--muted);
    font-size: 15px; padding: 0 0 2px; cursor: pointer; transition: color .15s, border-color .15s;
  }
  .navbtn:hover { color: var(--text); border-color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 13px; }
  .stat {
    background: rgba(146, 163, 200, .06); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 4px 6px; text-align: center;
  }
  .stat b { display: block; font: 700 14.5px/1.1 var(--mono); letter-spacing: -.02em; }
  .stat span { display: block; margin-top: 2px; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; }
  .stat.hot b { color: var(--accent-2); }

  .controls { padding: 12px 16px 11px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .search { position: relative; }
  .search input {
    width: 100%; background: rgba(146, 163, 200, .07); border: 1px solid var(--line); color: var(--text);
    border-radius: 11px; padding: 9px 12px 9px 34px; font: 500 13.5px var(--body); outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { border-color: var(--accent); background: rgba(146,163,200,.04); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--faint); }

  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: flex; background: rgba(146,163,200,.07); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); font: 600 12px var(--body);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: background .18s, color .18s;
  }
  .seg button.on { background: var(--accent); color: #fff; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { position: relative; cursor: pointer; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span {
    display: inline-flex; align-items: center; gap: 5px; padding: 5.5px 10px; border-radius: 999px;
    background: transparent; border: 1px solid var(--line); color: var(--faint);
    font-size: 11.5px; font-weight: 600; user-select: none; -webkit-user-select: none;
    transition: all .18s;
  }
  .chip span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; }
  .chip input:checked + span { background: var(--accent-soft); border-color: rgba(255,107,53,.45); color: var(--accent-2); }
  .chip input:checked + span::before { background: var(--accent); opacity: 1; }
  .chip:hover span { border-color: var(--line-2); }

  /* tabs */
  .tabs { display: flex; gap: 2px; padding: 10px 16px 0; }
  .tab {
    flex: 1; background: none; border: none; border-bottom: 2px solid transparent; color: var(--faint);
    font: 700 11.5px var(--body); text-transform: uppercase; letter-spacing: .08em;
    padding: 7px 4px 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: color .18s, border-color .18s;
  }
  .tab .n { font: 700 10px/1.5 var(--mono); background: rgba(146,163,200,.12); border-radius: 999px; padding: 1px 7px; color: var(--muted); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab.on .n { background: var(--accent-soft); color: var(--accent-2); }
  .list-note { display: flex; align-items: center; padding: 9px 18px 3px; color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
  .list-note .reset {
    margin-left: auto; display: none; background: none; border: none; color: var(--accent);
    font: 700 11px var(--body); letter-spacing: 0; text-transform: none; cursor: pointer; padding: 2px 4px;
  }
  .list-note .reset:hover { text-decoration: underline; }

  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 12px; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  #list::-webkit-scrollbar { width: 7px; }
  #list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  .item {
    display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 11px;
    cursor: pointer; border: 1px solid transparent; animation: rise .4s var(--ease) both;
    transition: background .15s, border-color .15s;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  .item:hover { background: rgba(146,163,200,.07); border-color: var(--line); }
  .item.active { background: var(--accent-soft); border-color: rgba(255,107,53,.4); }
  .swatch { flex: 0 0 auto; width: 13px; height: 13px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.16); }
  .item .body { flex: 1; min-width: 0; }
  .item .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .cnt { font: 700 13px var(--mono); color: var(--text); }
  .item .cnt small { display: block; font: 500 8.5px var(--body); color: var(--faint); text-transform: uppercase; letter-spacing: .07em; text-align: right; }
  .apx { color: var(--accent-2); font-weight: 700; }
  .item .name .code {
    display: inline-block; margin-right: 6px; padding: 1px 5px; border-radius: 5px;
    background: rgba(255, 61, 90, .13); border: 1px solid rgba(255, 61, 90, .35);
    color: var(--tower); font: 700 10.5px var(--mono); letter-spacing: .04em; vertical-align: 1px;
  }
  .twr-ico {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: rgba(255, 61, 90, .13); border: 1px solid rgba(255, 61, 90, .35); color: var(--tower);
    font: 700 12px var(--mono);
  }
  .empty { padding: 26px 16px; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6; }

  .foot { border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
  .foot button {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
    background: rgba(146,163,200,.07); border: 1px solid var(--line); color: var(--text);
    font: 600 12.5px var(--body); padding: 9px; border-radius: 10px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .foot button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .foot button svg { width: 14px; height: 14px; color: var(--muted); }
  .foot button:hover svg { color: var(--accent-2); }

  /* ═══════════════ floating map bar (top-right) ═══════════════ */
  #mapbar {
    position: absolute; z-index: 25; top: 14px; right: 14px; display: flex; gap: 8px; align-items: center;
  }
  #mapbar .seg {
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
  }
  #mapbar .seg button { padding: 7px 13px; font-size: 12px; }

  /* ═══════════════ map markers ═══════════════ */
  /* marker root must stay untouched: MapLibre drives its inline `transform` every
     frame, so no transition/transform here — visuals live on the inner .mdot */
  .mhl { width: 15px; height: 15px; cursor: pointer; }
  .mhl .mdot {
    display: block; width: 100%; height: 100%; border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255,255,255,.75), 0 2px 8px rgba(0,0,0,.6);
    transition: transform .15s var(--ease);
  }
  .mhl:hover .mdot { transform: scale(1.35); }

  /* no `position` here — it must stay `absolute` from .maplibregl-marker, or the
     marker joins normal flow and drifts off its coordinate as the map zooms */
  .hub { width: 46px; height: 46px; cursor: pointer; }
  .hub .ring, .hub .ring2 {
    position: absolute; inset: 0; border-radius: 50%; border: 2.5px solid var(--tower);
    animation: pulse 2.6s cubic-bezier(.2,.6,.36,1) infinite;
  }
  .hub .ring2 { animation-delay: 1.3s; }
  @keyframes pulse { 0% { transform: scale(.55); opacity: .9; } 75%, 100% { transform: scale(2.05); opacity: 0; } }
  .hub .core {
    position: absolute; inset: 6px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: radial-gradient(circle at 50% 30%, #ff6478, #d91437 78%);
    border: 2.5px solid rgba(255,255,255,.92); box-shadow: 0 3px 10px rgba(0, 0, 0, .5);
    transition: transform .15s var(--ease);
  }
  .hub:hover .core { transform: scale(1.12); }
  .hub .core svg { width: 17px; height: 17px; }
  .hub .num {
    position: absolute; top: -3px; right: -3px; z-index: 3; min-width: 19px; height: 19px; padding: 0 5px;
    border-radius: 999px; background: #0b0f18; color: #fff; border: 2px solid #fff;
    font: 700 10.5px/15px var(--mono); text-align: center;
  }

  /* ═══════════════ popups (MapLibre) ═══════════════ */
  .maplibregl-popup { z-index: 40; max-width: 300px !important; }
  .maplibregl-popup-content {
    background: var(--glass-2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: var(--text); border: 1px solid var(--line-2); border-radius: 14px;
    box-shadow: var(--shadow); padding: 13px 15px 12px; font-family: var(--body);
  }
  .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--glass-2); }
  .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--glass-2); }
  .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--glass-2); }
  .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--glass-2); }
  .maplibregl-popup-close-button {
    color: var(--muted); font-size: 19px; right: 5px; top: 3px; border-radius: 7px; width: 24px; height: 24px;
  }
  .maplibregl-popup-close-button:hover { background: rgba(146,163,200,.12); color: var(--text); }
  .pp { min-width: 190px; }
  .pp-k { font: 700 9.5px var(--body); letter-spacing: .13em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
  .pp-k.twr { color: var(--tower); }
  .pp-k::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pp-t { font-size: 14.5px; font-weight: 700; line-height: 1.3; padding-right: 12px; }
  .pp-sub { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .pp-rows { margin-top: 9px; border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .pp-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; font-size: 12px; color: var(--muted); }
  .pp-row b { font: 600 12px var(--mono); color: var(--text); white-space: nowrap; }
  .pp-row b.hot { color: var(--accent-2); font-size: 13px; }
  .pp-apx { margin-top: 7px; font-size: 11px; color: var(--accent-2); }
  .pp-actions { display: flex; gap: 12px; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 9px; }
  .pp-actions a { color: #ff8f66; font-size: 12px; font-weight: 600; text-decoration: none; }
  .pp-actions a:hover { text-decoration: underline; }

  /* hover tip */
  #tip {
    position: fixed; z-index: 60; display: none; pointer-events: none;
    background: rgba(7, 10, 17, .94); color: #fff; border: 1px solid var(--line-2); border-radius: 8px;
    padding: 6px 10px; font: 500 12px var(--body); max-width: 250px; box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  #tip b { font-family: var(--mono); color: var(--accent-2); }

  /* MapLibre chrome, re-skinned */
  .maplibregl-ctrl-group {
    background: var(--glass) !important; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px !important; box-shadow: var(--shadow) !important; overflow: hidden;
  }
  .maplibregl-ctrl-group button { width: 34px !important; height: 34px !important; border: none !important; }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--line) !important; }
  .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(.85) hue-rotate(180deg); }
  body.lightmap .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: none; }
  .maplibregl-ctrl-attrib {
    background: rgba(7,10,17,.72) !important; color: var(--faint); font-size: 10px; border-radius: 8px 0 0 0;
  }
  .maplibregl-ctrl-attrib a { color: var(--muted) !important; }
  body.lightmap .maplibregl-ctrl-attrib { background: rgba(255,255,255,.72) !important; }
  body.lightmap .maplibregl-ctrl-attrib a { color: #555 !important; }
  .maplibregl-ctrl-scale {
    background: rgba(7,10,17,.6); color: var(--muted); border: 1px solid var(--line-2); border-top: none;
    font: 500 10px var(--mono); border-radius: 0 0 6px 6px;
  }

  /* ═══════════════ mobile: bottom sheet ═══════════════ */
  @media (max-width: 720px) {
    #panel {
      top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: 74dvh;
      border-radius: 20px 20px 0 0; border-left: none; border-right: none; border-bottom: none;
      transform: translateY(0); transition: transform .34s var(--ease);
    }
    body.sheet-collapsed #panel { transform: translateY(calc(100% - var(--peek))); opacity: 1; pointer-events: auto; }
    body.panel-hidden #panel { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .navbtn, #panelOpen { display: none !important; }
    .sheet-toggle {
      display: flex; flex: 0 0 auto; flex-direction: column; align-items: center; gap: 8px;
      height: 64px; width: 100%; padding: 10px 16px 0; background: none; border: none; color: var(--text);
      font: 500 13px var(--body); cursor: pointer; touch-action: none;
    }
    .sheet-toggle .grab { width: 42px; height: 4.5px; border-radius: 999px; background: rgba(146,163,200,.35); }
    .sheet-toggle .st-row { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
    .sheet-toggle .st-row b { color: var(--text); font-family: var(--mono); font-size: 13.5px; }
    .sheet-toggle .chev { color: var(--faint); transition: transform .3s var(--ease); }
    body.sheet-collapsed .sheet-toggle .chev { transform: rotate(180deg); }
    .head { padding-top: 0; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .search input { font-size: 16px; }  /* ≥16px — iOS won't zoom the page on focus */
    #mapbar { top: env(safe-area-inset-top, 0px); right: 10px; margin-top: 10px; }
    #mapbar .seg button { padding: 7px 10px; font-size: 11.5px; }
    .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom: var(--peek); }
    .maplibregl-popup { max-width: 84vw !important; }
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- floating basemap switcher -->
<div id="mapbar">
  <div class="seg" id="styleSeg">
    <button data-s="dark" class="on">Тёмная</button>
    <button data-s="streets">Улицы</button>
    <button data-s="sat">Спутник</button>
  </div>
</div>

<aside id="panel">
  <button id="sheetToggle" class="sheet-toggle" aria-expanded="true">
    <span class="grab"></span>
    <span class="st-row">📡 <b id="shAnt">—</b> антенн · <b id="shTwr">8</b> вышек <span class="chev">▾</span></span>
  </button>

  <header class="head">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="11" r="1.6" fill="currentColor" stroke="none"/>
          <path d="M8.6 14.4a4.8 4.8 0 0 1 0-6.8M15.4 7.6a4.8 4.8 0 0 1 0 6.8"/>
          <path d="M5.8 17.2a8.8 8.8 0 0 1 0-12.4M18.2 4.8a8.8 8.8 0 0 1 0 12.4"/>
          <path d="M12 13v8"/>
        </svg>
      </div>
      <div>
        <h1>Дилшод <em>·</em> Душанбе</h1>
        <div class="sub">Реестр антенн ЧДММ «Дилшод» · 01.05.2024</div>
      </div>
      <button id="panelHide" class="navbtn" title="Скрыть панель">‹</button>
    </div>
    <div class="stats">
      <div class="stat hot"><b id="stAnt">0</b><span>антенн</span></div>
      <div class="stat"><b id="stAddr">0</b><span>адресов</span></div>
      <div class="stat"><b id="stMah">0</b><span>махалл</span></div>
      <div class="stat"><b>8</b><span>вышек</span></div>
    </div>
  </header>

  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
      <input id="search" type="text" placeholder="Поиск махалли или вышки…" autocomplete="off" />
    </div>
    <div class="row">
      <div class="chips">

      tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
      attribution: "© Esri, Maxar, Earthstar Geographics",
    } },
    layers: [{ id: "esri", type: "raster", source: "esri" }],
  },
};

/* ── state ── */
let map, popup;
let activeFam = null, activeTab = "mah", query = "";
let showMarks = true, showHubs = true, showRadius = false;
let mahMarkers = [], hubMarkers = [];
let antennaGeo = null;

const $ = (id) => document.getElementById(id);
const $tip = $("tip");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (n) => n.toLocaleString("ru-RU");
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return f[(a > 10 && a < 20) ? 2 : (b > 1 && b < 5) ? 1 : (b === 1) ? 0 : 2]; };
const cleanM = (m) => m.replace(/^махал+аи\s*/i, "");
const isMobile = () => window.matchMedia("(max-width: 720px)").matches;

/* deterministic scatter: same seed → dots never jump between reloads */
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ── 8 278 антенн из 450 адресных строк → GeoJSON ── */
function buildAntennas(){
  const feats = [];
  const mLat = 111320, base = 111320 * Math.cos(38.57 * Math.PI / 180);
  for (let ri = 0; ri < REGISTRY.length; ri++){
    const r = REGISTRY[ri];
    const rng = mulberry32(hashStr(r.m + "|" + r.h + "|" + ri));
    const n = r.c | 0, spread = 55;
    for (let k = 0; k < n; k++){
      const rr = spread * Math.sqrt(rng()), aa = 2 * Math.PI * rng();
      feats.push({
        type: "Feature",
        geometry: { type: "Point", coordinates: [ r.lng + (rr * Math.cos(aa)) / base, r.lat + (rr * Math.sin(aa)) / mLat ] },
        properties: { ri, fi: r.fi },
      });
    }
  }
  antennaGeo = { type: "FeatureCollection", features: feats };
}

function circlePoly(lat, lng, rM, steps = 72){
  const mLat = 111320, mLng = 111320 * Math.cos(lat * Math.PI / 180), ring = [];
  for (let i = 0; i <= steps; i++){
    const a = (i / steps) * 2 * Math.PI;
    ring.push([lng + (rM * Math.cos(a)) / mLng, lat + (rM * Math.sin(a)) / mLat]);
  }
  return ring;
}
const hubZones = () => ({
  type: "FeatureCollection",
  features: HUBS.map((h, i) => ({ type: "Feature", properties: { i }, geometry: { type: "Polygon", coordinates: [circlePoly(h.lat, h.lng, HUB_RADIUS_M)] } })),
});

/* ── цвета точек: махалла → свой цвет ── */
function colorExpr(){
  const e = ["match", ["get", "fi"]];
  FAMILIES.forEach((f, i) => e.push(i, f.color));
  e.push("#94a3b8");
  return e;
}
function applyIsolation(){
  if (!map.getLayer("ant-dots")) return;
  if (activeFam == null){
    map.setPaintProperty("ant-dots", "circle-color", colorExpr());
    map.setPaintProperty("ant-dots", "circle-opacity", 0.8);
  } else {
    map.setPaintProperty("ant-dots", "circle-color",
      ["case", ["==", ["get", "fi"], activeFam], FAMILIES[activeFam].color, "#5b667f"]);
    map.setPaintProperty("ant-dots", "circle-opacity",
      ["case", ["==", ["get", "fi"], activeFam], 0.92, 0.05]);
  }
}

/* ── добавление слоёв (вызывается заново при смене стиля) ── */
function addOverlays(){
  if (map.getSource("antennas")) return;

  map.addSource("antennas", { type: "geojson", data: antennaGeo });
  map.addSource("hubzones", { type: "geojson", data: hubZones() });

  map.addLayer({
    id: "hub-fill", type: "fill", source: "hubzones",
    paint: { "fill-color": "#ff3d5a", "fill-opacity": 0.02 },   /* 8 circles overlap city-wide — keep the tint faint */
    layout: { visibility: showRadius ? "visible" : "none" },
  });
  map.addLayer({
    id: "hub-line", type: "line", source: "hubzones",
    paint: { "line-color": "#ff3d5a", "line-opacity": 0.5, "line-width": 1.4, "line-dasharray": [3, 3] },
    layout: { visibility: showRadius ? "visible" : "none" },
  });

  map.addLayer({
    id: "ant-dots", type: "circle", source: "antennas",
    paint: {
      "circle-color": colorExpr(),
      "circle-opacity": 0.8,
      "circle-radius": ["interpolate", ["exponential", 1.4], ["zoom"], 9, 0.4, 12, 1.1, 14, 2.6, 16, 6, 18.5, 13],
      "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 14.5, 0, 16, 1],
      "circle-stroke-color": "rgba(6,9,15,.6)",
    },
  });

  applyIsolation();
}

/* ── HTML-маркеры ── */
const TWR_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="10" r="1.5" fill="currentColor" stroke="none"/><path d="M8.9 13.1a4.4 4.4 0 0 1 0-6.2M15.1 6.9a4.4 4.4 0 0 1 0 6.2"/><path d="M6.3 15.7a8 8 0 0 1 0-11.4M17.7 4.3a8 8 0 0 1 0 11.4"/><path d="M12 12v9"/></svg>';

function buildMahMarkers(){
  mahMarkers.forEach((m) => m.remove()); mahMarkers = [];
  if (!showMarks) return;
  FAMILIES.forEach((f, i) => {
    const el = document.createElement("div");
    el.className = "mhl";
    const dot = document.createElement("span");
    dot.className = "mdot"; dot.style.background = f.color;
    el.appendChild(dot);
    el.title = f.label + " — " + fmt(f.count) + " " + plural(f.count, ["антенна","антенны","антенн"]);
    el.addEventListener("click", (e) => { e.stopPropagation(); selectFam(i, true); });
    mahMarkers.push(new maplibregl.Marker({ element: el }).setLngLat([f.lng, f.lat]).addTo(map));
  });
}
function buildHubMarkers(){
  hubMarkers.forEach((m) => m.remove()); hubMarkers = [];
  if (!showHubs) return;
  HUBS.forEach((h, i) => {
    const el = document.createElement("div");
    el.className = "hub";
    el.innerHTML = '<span class="ring"></span><span class="ring ring2"></span><div class="core">' + TWR_SVG + '</div><span class="num">' + (i + 1) + "</span>";
    el.title = "Вышка " + hubName(h, i) + " — " + h.addr;
    el.addEventListener("click", (e) => { e.stopPropagation(); openHub(i, false); });
    hubMarkers.push(new maplibregl.Marker({ element: el }).setLngLat([h.lng, h.lat]).addTo(map));
  });
}

/* ── попапы ── */
function showPopup(lngLat, html){
  if (popup) popup.remove();
  popup = new maplibregl.Popup({ offset: 16, maxWidth: "300px" }).setLngLat(lngLat).setHTML(html).addTo(map);
}
const gLink = (lat, lng) => 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
const yLink = (lat, lng) => 'https://yandex.ru/maps/?ll=' + lng + ',' + lat + '&z=17&pt=' + lng + ',' + lat;

function openHub(i, fly){
  const h = HUBS[i];
  if (fly){
    if (isMobile()) setSheet(true);
    map.flyTo({ center: [h.lng, h.lat], zoom: Math.max(map.getZoom(), 15), speed: 1.6, essential: true });
  }
  showPopup([h.lng, h.lat],
    '<div class="pp">'
    + '<div class="pp-k twr">Большая антенна · вышка</div>'
    + '<div class="pp-t">' + esc(hubName(h, i)) + ' · ' + esc(h.addr) + '</div>'
    + '<div class="pp-sub">' + esc(h.area) + '</div>'
    + '<div class="pp-rows">'
    +   '<div class="pp-row"><span>Gateway ID</span><b>' + esc(h.gatewayId) + '</b></div>'
    +   '<div class="pp-row"><span>Радиус покрытия</span><b class="hot">9 км</b></div>'
    +   '<div class="pp-row"><span>Координаты</span><b>' + h.lat.toFixed(6) + ', ' + h.lng.toFixed(6) + '</b></div>'
    + '</div>'
    + '<div class="pp-actions"><a href="' + gLink(h.lat, h.lng) + '" target="_blank" rel="noopener">Google Maps ↗</a>'
    + '<a href="' + yLink(h.lat, h.lng) + '" target="_blank" rel="noopener">Яндекс ↗</a></div>'
    + '</div>');
}
function openAddress(r, lngLat){
  showPopup(lngLat,
    '<div class="pp">'
    + '<div class="pp-k">Адрес · махалла</div>'
    + '<div class="pp-t">' + esc(cleanM(r.m)) + '</div>'
    + (r.h ? '<div class="pp-sub">хона / кӯча: <b style="color:var(--text)">' + esc(r.h) + '</b></div>' : '')
    + '<div class="pp-rows">'
    +   '<div class="pp-row"><span>Антенн по адресу</span><b class="hot">' + fmt(r.c) + '</b></div>'
    +   '<div class="pp-row"><span>Координаты</span><b>' + r.lat.toFixed(5) + ', ' + r.lng.toFixed(5) + '</b></div>'
    + '</div>'
    + (r.ap ? '<div class="pp-apx">≈ примерное расположение (уровень махалли)</div>' : '')
    + '<div class="pp-actions"><a href="' + gLink(r.lat, r.lng) + '" target="_blank" rel="noopener">Google Maps ↗</a></div>'
    + '</div>');
}
function openFam(i){
  const f = FAMILIES[i];
  showPopup([f.lng, f.lat],
    '<div class="pp">'
    + '<div class="pp-k">Махалла</div>'
    + '<div class="pp-t">' + esc(f.label) + '</div>'
    + '<div class="pp-rows">'
    +   '<div class="pp-row"><span>Антенн</span><b class="hot">' + fmt(f.count) + '</b></div>'
    +   '<div class="pp-row"><span>Адресов в реестре</span><b>' + f.rows + '</b></div>'
    + '</div>'
    + (f.approx ? '<div class="pp-apx">≈ примерное расположение</div>' : '')
    + '</div>');
}

/* ── выбор махалли (изоляция) ── */
function selectFam(i, toggle){
  activeFam = (toggle && activeFam === i) ? null : i;
  if (activeFam != null){
    if (isMobile()) setSheet(true);
    const f = FAMILIES[i];
    map.flyTo({ center: [f.lng, f.lat], zoom: Math.max(map.getZoom(), 14.2), speed: 1.5, essential: true });
    openFam(i);
  } else if (popup) popup.remove();
  applyIsolation(); renderList();
}
function resetFam(){ activeFam = null; if (popup) popup.remove(); applyIsolation(); renderList(); fitAll(); }

/* ── список в панели ── */
function renderList(){
  const $list = $("list"); $list.innerHTML = "";
  const q = query.trim().toLowerCase();
  let shown = 0;

  if (activeTab === "mah"){
    $("listNote").textContent = "по числу антенн";
    FAMILIES.forEach((f, i) => {
      if (q && !f.label.toLowerCase().includes(q) && !f.key.includes(q)) return;
      const el = document.createElement("div");
      el.className = "item" + (activeFam === i ? " active" : "");
      el.style.animationDelay = Math.min(shown * 22, 380) + "ms";
      el.innerHTML =
        '<div class="swatch" style="background:' + f.color + ';color:' + f.color + '"></div>'
        + '<div class="body"><div class="name">' + esc(f.label) + (f.approx ? ' <span class="apx" title="примерное расположение">≈</span>' : '') + '</div>'
        + '<div class="meta">' + f.rows + ' ' + plural(f.rows, ["адрес","адреса","адресов"]) + '</div></div>'
        + '<div class="cnt">' + fmt(f.count) + '<small>антенн</small></div>';
      el.onclick = () => selectFam(i, true);
      $list.appendChild(el); shown++;
    });
  } else {
    $("listNote").textContent = "большие антенны · адреса";
    HUBS.forEach((h, i) => {
      if (q && !(h.addr + " " + h.area + " " + hubName(h, i) + " " + h.gatewayId).toLowerCase().includes(q)) return;
      const el = document.createElement("div");
      el.className = "item";
      el.style.animationDelay = Math.min(shown * 22, 380) + "ms";
      el.innerHTML =
        '<div class="twr-ico">' + (i + 1) + '</div>'
        + '<div class="body"><div class="name"><span class="code">' + esc(hubName(h, i)) + '</span></div>'
        + '<div class="meta">' + esc(h.gatewayId) + '</div>'
        + '<div class="meta">' + esc(h.addr) + ' · ' + esc(h.area) + '</div></div>'
        + '<div class="cnt" style="font-size:11px;color:var(--muted)">' + h.lat.toFixed(3) + '<small style="text-transform:none;letter-spacing:0">' + h.lng.toFixed(3) + '</small></div>';
      el.onclick = () => openHub(i, true);
      $list.appendChild(el); shown++;
    });
  }
  if (!shown) $list.innerHTML = '<div class="empty">Ничего не найдено по запросу «' + esc(query) + '»</div>';
  $("reset").style.display = activeFam != null ? "block" : "none";
}

function fitAll(){
  const b = new maplibregl.LngLatBounds();
  REGISTRY.forEach((r) => b.extend([r.lng, r.lat]));
  HUBS.forEach((h) => b.extend([h.lng, h.lat]));
  map.fitBounds(b, { padding: fitPad(), maxZoom: 14.5, duration: 1100 });
}
const fitPad = () => isMobile()
  ? { top: 80, right: 34, bottom: 110, left: 34 }
  : { top: 60, right: 80, bottom: 60, left: document.body.classList.contains("panel-hidden") ? 80 : 420 };

/* ── шапка/статистика ── */
(function initStats(){
  const totalAnt = FAMILIES.reduce((s, f) => s + f.count, 0);
  $("stAnt").textContent = fmt(totalAnt);
  $("stAddr").textContent = fmt(REGISTRY.length);
  $("stMah").textContent = FAMILIES.length;
  $("nMah").textContent = FAMILIES.length;
  $("shAnt").textContent = fmt(totalAnt);
})();

/* ── карта ── */
buildAntennas();
const bounds0 = (() => { const b = new maplibregl.LngLatBounds(); REGISTRY.forEach((r) => b.extend([r.lng, r.lat])); HUBS.forEach((h) => b.extend([h.lng, h.lat])); return b; })();

map = new maplibregl.Map({
  container: "map",
  style: STYLES.dark,
  bounds: bounds0,
  fitBoundsOptions: { padding: fitPad(), maxZoom: 14.5 },
  minZoom: 8.5, maxZoom: 19.5,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 90 }), "bottom-left");
map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }), "bottom-right");

/* re-attach data layers whenever a (new) style finishes loading — addOverlays is
   idempotent, and setStyle() wipes all custom sources/layers */
function ensureOverlays(){
  if (map.getSource("antennas") || !map.isStyleLoaded()) return;
  try { addOverlays(); } catch (e) { /* style mid-swap — retried on next event */ }
}
map.on("style.load", ensureOverlays);
map.on("styledata", ensureOverlays);
map.on("idle", ensureOverlays);
map.on("load", () => { buildMahMarkers(); buildHubMarkers(); });

/* Some embedded webviews report a 0×0 container at boot, leaving the canvas at
   MapLibre's 400×300 fallback. Timers can be throttled there too, so correct the
   size from several signals (ResizeObserver, the map's own render loop, resize)
   and keep trying until the canvas truly matches the container. */
(function bootSize(){
  let settled = false;
  const fix = () => {
    if (settled) return;
    const el = document.getElementById("map"), cv = map.getCanvas();
    const want = el.clientWidth, have = parseInt(cv.style.width, 10) || 0;
    if (!want) return;
    if (Math.abs(want - have) > 2){
      map.resize();
      map.fitBounds(bounds0, { padding: fitPad(), maxZoom: 14.5, duration: 0 });
    } else if (have > 401) settled = true;   // real layout applied — stop checking
  };
  new ResizeObserver(fix).observe(document.getElementById("map"));
  map.on("render", fix);
  window.addEventListener("resize", fix);
  document.addEventListener("visibilitychange", fix);
})();

/* клики и ховер по точкам-антеннам */
map.on("click", "ant-dots", (e) => {
  const f = e.features[0];
  openAddress(REGISTRY[f.properties.ri], e.lngLat);
});
map.on("mouseenter", "ant-dots", () => { map.getCanvas().style.cursor = "pointer"; });
map.on("mouseleave", "ant-dots", () => { map.getCanvas().style.cursor = ""; $tip.style.display = "none"; });
map.on("mousemove", "ant-dots", (e) => {
  if (isMobile() || !e.features.length) return;
  const r = REGISTRY[e.features[0].properties.ri];
  $tip.style.display = "block";
  $tip.style.left = (e.originalEvent.clientX + 14) + "px";
  $tip.style.top = (e.originalEvent.clientY + 14) + "px";
  $tip.innerHTML = esc(cleanM(r.m)) + (r.h ? ", " + esc(r.h) : "") + " · <b>" + fmt(r.c) + "</b>";
});

/* ── UI ── */
$("search").addEventListener("input", (e) => { query = e.target.value; renderList(); });

document.querySelectorAll("#styleSeg button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("#styleSeg button").forEach((x) => x.classList.toggle("on", x === b));
  document.body.classList.toggle("lightmap", b.dataset.s === "streets");
  map.setStyle(STYLES[b.dataset.s]);   // style.load re-adds the overlays
});
$("tgMarks").onchange = (e) => { showMarks = e.target.checked; buildMahMarkers(); };
$("tgHubs").onchange = (e) => {
  showHubs = e.target.checked; buildHubMarkers();
  const v = (showHubs && showRadius) ? "visible" : "none";
  if (map.getLayer("hub-fill")){ map.setLayoutProperty("hub-fill", "visibility", v); map.setLayoutProperty("hub-line", "visibility", v); }
};
$("tgRadius").onchange = (e) => {
  showRadius = e.target.checked;
  const v = (showHubs && showRadius) ? "visible" : "none";
  if (map.getLayer("hub-fill")){ map.setLayoutProperty("hub-fill", "visibility", v); map.setLayoutProperty("hub-line", "visibility", v); }
};
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
  activeTab = t.dataset.t;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
  renderList();
});
$("reset").onclick = resetFam;
$("fit").onclick = () => { if (isMobile()) setSheet(true); if (activeFam != null) resetFam(); else fitAll(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && activeFam != null) resetFam(); });

$("exportCsv").onclick = () => {
  const rows = [["mahalla","house","antennas","lat","lng","approx"]];
  REGISTRY.forEach((r) => rows.push([r.m, r.h, r.c, r.lat, r.lng, r.ap ? "approx" : "geocoded"]));
  const csv = rows.map((row) => row.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "dilshod-registry.csv"; a.click();
};

/* ── панель: сворачивание (desktop) + bottom sheet (mobile) ── */
$("panelHide").onclick = () => document.body.classList.add("panel-hidden");
$("panelOpen").onclick = () => document.body.classList.remove("panel-hidden");

function setSheet(collapsed){
  document.body.classList.toggle("sheet-collapsed", collapsed);
  $("sheetToggle").setAttribute("aria-expanded", String(!collapsed));
}
$("sheetToggle").addEventListener("click", () => setSheet(!document.body.classList.contains("sheet-collapsed")));
(function(){
  let y0 = null; const t = $("sheetToggle");
  t.addEventListener("touchstart", (e) => { y0 = e.touches[0].clientY; }, { passive: true });
  t.addEventListener("touchend", (e) => {
    if (y0 == null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    e.preventDefault();
    if (dy > 24) setSheet(true); else if (dy < -24) setSheet(false);
    else setSheet(!document.body.classList.contains("sheet-collapsed"));
  }, { passive: false });
})();
if (isMobile()) setSheet(true);   // телефоны стартуют с картой во весь экран

renderList();
</script>
</body>
</html>
