<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#eef1f5" />
<title>Tojikelectrocomplect &amp; Baylan · Реестр модулей</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>" />
<link rel="preconnect" href="https://maps.googleapis.com" />
<link rel="preconnect" href="https://maps.gstatic.com" crossorigin />
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="./app.css" />
<link rel="stylesheet" href="./sino-map.css" />
</head>
<body>
<div id="map"></div>
<div id="mapError" role="alert"></div>
<aside id="panel">
  <button id="sheetToggle" class="sheet-toggle" aria-expanded="true"><span class="grab"></span><span class="st-row"><b id="shAnt">—</b> модулей · Реестр <span class="chev">▾</span></span></button>
  <header class="head">
    <div class="brand"><div><h1>Tojikelectrocomplect <em>&amp;</em> Baylan</h1><div class="sub">Общий реестр · март–май 2026</div></div><button id="panelHide" class="navbtn" title="Скрыть панель" aria-label="Скрыть панель">‹</button></div>
    <div class="stats">
      <div class="stat hot"><b id="stAnt">—</b><span>уникальных ID</span></div>
      <div class="stat"><b id="stMapped">—</b><span>на карте</span></div>
      <div class="stat"><b id="stPending">—</b><span>уточнить</span></div>
      <div class="stat"><b id="stBuildings">—</b><span>зданий</span></div>
    </div>
  </header>
  <div class="controls">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg><input id="search" type="search" placeholder="Улица, дом или Module ID…" aria-label="Поиск адреса или модуля" autocomplete="off" /></div>
    <div class="row"><div class="chips">
      <label class="chip"><input type="checkbox" id="tgBoundary" checked /><span>Граница Сино</span></label>
      <label class="chip"><input type="checkbox" id="tgHubs" checked /><span>Вышки</span></label>
      <label class="chip"><input type="checkbox" id="tgRadius" /><span>9 км</span></label>
    </div></div>
    <div class="seg" role="group" aria-label="Проверка адресов">
      <button type="button" class="on" data-status="all" aria-pressed="true">Все</button>
      <button type="button" data-status="mapped" aria-pressed="false">На карте</button>
      <button type="button" data-status="pending" aria-pressed="false">Уточнить</button>
    </div>
    <p class="source-note" id="sourceNote">Точки стоят на найденных зданиях. Номер на точке — число модулей.</p>
  </div>
  <nav class="tabs"><button class="tab on" data-tab="addresses">Адреса <span class="n" id="nAddresses">—</span></button><button class="tab" data-tab="gateways">Вышки <span class="n">8</span></button></nav>
  <div class="list-note"><span id="listNote" aria-live="polite"></span><button class="reset" id="reset">✕ Сброс</button></div>
  <div id="list"></div>
  <footer class="foot"><button id="exportCsv">Экспорт CSV</button><button id="fit">Показать все</button></footer>
</aside>
<button id="panelOpen">☰ Реестр</button>
<dialog id="addressDetails" aria-labelledby="detailsTitle"><div class="details-bar" id="detailsBar"><span class="grab"></span><button class="dialog-close" id="closeDetails" aria-label="Закрыть">×</button></div><div id="detailsContent"></div></dialog>
<script defer src="./vendor/leaflet/leaflet.js"></script>
<script defer src="./map-config.js"></script>
<script defer src="./vendor/google-mutant/Leaflet.GoogleMutant.js"></script>
<script defer src="./map-background.js"></script>
<script defer src="./dgis-layer.js"></script>
<script defer src="./dgis-view.js"></script>
<script defer src="./ui.js"></script>
<script defer src="./gateway-data.js"></script>
<script defer src="./sino-data.js"></script>
<script defer src="./sino-map.js"></script>
</body>
</html>
